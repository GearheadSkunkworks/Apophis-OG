<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 40" role="img" aria-label="OpenGenerator">
  <title>OpenGenerator</title>
  <!-- rising-signal mark: generated traffic, fading orange to near-black (Forge) -->
  <g>
    <rect x="0"  y="24" width="6" height="12" rx="1.5" fill="#E8863B"/>
    <rect x="9"  y="17" width="6" height="19" rx="1.5" fill="#C2410C"/>
    <rect x="18" y="10" width="6" height="26" rx="1.5" fill="#7A2908"/>
    <rect x="27" y="3"  width="6" height="33" rx="1.5" fill="#0A0A0A"/>
  </g>
  <text x="42" y="30" textLength="206" lengthAdjust="spacingAndGlyphs"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="700">
    <tspan fill="#1F2937">Open</tspan><tspan fill="#C2410C">Generator</tspan>
  </text>
</svg>
