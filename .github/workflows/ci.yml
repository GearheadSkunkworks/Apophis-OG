name: CI

# The regression gate (selftest.py) on Linux (Python 3.11 and 3.14) and macOS (3.13), for pushes to main and pull requests.
# Read-only token; no secrets are used. Actions are pinned to commit SHAs and only GitHub-owned actions are allowed. Pull requests from forks run without secrets and need approval.
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dev          # the application lives in dev/; the repository root holds the documents

jobs:
  selftest:
    name: self-test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.11", "3.14" ]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python selftest.py
